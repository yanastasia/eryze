<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Crvenite Bregovi project artwork</title>
  <desc id="desc">An editorial landscape in deep red, cream, and charcoal.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17100f"/>
      <stop offset="0.62" stop-color="#55201d"/>
      <stop offset="1" stop-color="#a84332"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bd5038"/>
      <stop offset="1" stop-color="#581a18"/>
