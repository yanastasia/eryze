    <text x="100" y="235" font-family="Georgia, serif" font-size="82">ЦРВЕНИТЕ</text>
    <text x="100" y="325" font-family="Georgia, serif" font-size="82">БРЕГОВИ</text>
  </g>
  <text x="108" y="382" fill="#e0b18b" font-family="Arial, sans-serif" font-size="23" letter-spacing="5">КНИГА I · КОРЕНОТ</text>
  <line x1="108" y1="430" x2="440" y2="430" stroke="#e0b18b" stroke-width="2"/>
  <text x="108" y="475" fill="#f8ead3" font-family="Arial, sans-serif" font-size="20" letter-spacing="3">МИЛЕ Т. ЈАКИМОВСКИ</text>
