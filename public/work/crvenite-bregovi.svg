  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1190" cy="255" r="125" fill="#f0d9b7" opacity=".93"/>
  <path d="M0 680 260 540 470 630 760 410 990 610 1240 480 1600 655V1000H0Z" fill="#1b1212" opacity=".83"/>
  <path d="M0 770 330 630 620 755 930 575 1200 720 1430 620 1600 700V1000H0Z" fill="url(#ridge)"/>
  <path d="M0 855 330 730 610 830 900 700 1220 830 1600 720V1000H0Z" fill="#160d0d"/>
